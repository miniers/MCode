name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v7

      - name: 检查版本
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then echo '::error::手动运行时必须选择 v* 标签作为 ref。'; exit 1; fi
          test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
          if [ ! -f CHANGELOG.md ]; then
            echo '::error::缺少 CHANGELOG.md。'
            exit 1
          fi
          awk -v version="$(jq -r .version mygo.json)" '
            /^## / {
              if (found) exit
              heading = $2
              sub(/^\[/, "", heading)
              sub(/\].*$/, "", heading)
              sub(/^v/, "", heading)
              if (heading == version) found = 1
              next
            }
            found {
              if ($0 ~ /^[[:space:]]*$/) {
                if (started) blanks = blanks $0 "\n"
              } else {
                printf "%s%s\n", blanks, $0
                blanks = ""
                started = 1
              }
            }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo '::error::CHANGELOG.md 中缺少当前版本的发布说明或内容为空。'
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建前端
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 创建发布草稿
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            args=(--draft --verify-tag --title "$GITHUB_REF_NAME" --notes '')
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${args[@]}"
          fi

      - name: 安装 NSIS
        run: |
          brew install makensis
          makensis -VERSION

      - name: 导入签名证书
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          if [[ -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            security default-keychain -s "$keychain"
            xcrun notarytool store-credentials mcode-notary --keychain "$keychain" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            echo 'MCODE_NOTARIZE=1' >> "$GITHUB_ENV"
          fi
          echo "MCODE_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: 构建并上传
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [[ -z "$MYGO_UPDATER_PRIVATE_KEY" ]]; then
            echo '::error::缺少 MYGO_UPDATER_PRIVATE_KEY，无法签名更新包。'
            exit 1
          fi
          if [[ -n "${MCODE_SIGN_IDENTITY:-}" ]]; then
            sign_args=(-sign "$MCODE_SIGN_IDENTITY")
          else
            sign_args=(-sign -)
          fi
          if [[ "${MCODE_NOTARIZE:-}" != 1 ]]; then
            sign_args+=(-skip-notarize)
          fi
          go tool mygo build -platform darwin/arm64,windows/amd64 -o dist "${sign_args[@]}" -upload
          if ! compgen -G 'dist/windows-amd64/*-setup-*-amd64.exe' > /dev/null; then
            echo '::error::未生成 Windows 安装程序。'
            exit 1
          fi

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${MCODE_NOTARIZE:-}" != 1 ]]; then
            if [[ -n "${MCODE_SIGN_IDENTITY:-}" ]]; then
              note='macOS 版已用 Developer ID 签名，但未做 Apple 公证。首次打开请右键 → 打开；或执行 xattr -dr com.apple.quarantine /Applications/MCode.app。'
            else
              note='macOS 版未签名（ad hoc），也未做 Apple 公证。首次打开请右键 → 打开；或执行 xattr -dr com.apple.quarantine /Applications/MCode.app。'
            fi
          fi
          printf '\n---\n\n' >> "$RUNNER_TEMP/notes.md"
          if [[ -n "${note:-}" ]]; then
            printf '%s\n' "$note" >> "$RUNNER_TEMP/notes.md"
          fi
          printf '%s\n' 'Windows 版未做代码签名，首次运行如遇 SmartScreen 提示，请点「更多信息」→「仍要运行」。' >> "$RUNNER_TEMP/notes.md"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --notes-file "$RUNNER_TEMP/notes.md"
